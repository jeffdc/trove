[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trove"
version = "0.1.0"
description = "Photo deduplication and organization CLI tool"
requires-python = ">=3.10"
dependencies = [
    "click",
    "rich",
    "typing_extensions",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
trove = "trove.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/trove"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # Line too long (we don't enforce line length)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
show_error_codes = true
